spring.application.name=anjosflow
# .env usa sintaxe simples KEY=value; variáveis do processo têm precedência.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:anjosflow}?connectTimeout=5&socketTimeout=5
spring.datasource.username=${POSTGRES_USER:anjosflow}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
